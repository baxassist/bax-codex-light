[project]
name = "bax-codex-light-agent"
version = "0.5.6"
description = "Контроллер проекта Codex для Бакса: сессии и фоновая работа"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "openai-codex==0.160.0",
    "mcp>=2.2,<3",
    "websockets>=17,<18",
]

[project.scripts]
bax-codex-light = "bax_codex_light.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/bax-codex/bax_codex_light"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["plugins/bax-codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["ASYNC109", "ASYNC110"]
